services:
  mongodb:
    image: mongo:7
    container_name: campus-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - campus-net

  cv-service:
    build:
      context: ./cv-service
      dockerfile: Dockerfile
    container_name: campus-cv
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - YOLO_MODEL_PATH=/app/yolov8n.pt
    networks:
      - campus-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/campus_lost_found
      - FLASK_SERVICE_URL=http://cv-service:5001
    depends_on:
      - mongodb
      - cv-service
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - campus-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - campus-net

volumes:
  mongo-data:

networks:
  campus-net:
    driver: bridge
